server {
  listen 80;
  
  client_max_body_size 10M;
  
  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/;
  }

  location /media/ {
    alias /app/media/;
    try_files $uri =404;
	}

  location /static/ {
    alias /static/;
    try_files $uri =404;
  }

  location / {
    proxy_pass http://frontend:3000;
  }
}
