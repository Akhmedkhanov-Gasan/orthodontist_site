name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build:
        description: "Force build"
        type: choice
        options: [none, all, backend, frontend, gateway]
        default: none
      force_deploy:
        description: "Force deploy even if no changes"
        type: boolean
        default: true

env:
  REGISTRY: agasan
  IMAGE_TAG: ${{ github.sha }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      gateway:  ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            gateway:
              - 'nginx/**'

  backend:
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.build == 'all' || inputs.build == 'backend'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/ortho_backend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/ortho_backend:prod
          cache-from: type=registry,ref=${{ env.REGISTRY }}/ortho_backend:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/ortho_backend:buildcache,mode=max
      - name: Smoke-test backend
        run: |
          ./.github/scripts/smoke_backend.sh \
            "${{ env.REGISTRY }}/ortho_backend:${{ env.IMAGE_TAG }}" \
            '${{ secrets.RECAPTCHA_SECRET }}'

  frontend:
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.build == 'all' || inputs.build == 'frontend'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/ortho_frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/ortho_frontend:prod
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.FRONTEND_API_URL }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/ortho_frontend:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/ortho_frontend:buildcache,mode=max

  gateway:
    needs: changes
    if: |
      needs.changes.outputs.gateway == 'true' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.build == 'all' || inputs.build == 'gateway'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/ortho_gateway:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/ortho_gateway:prod
          cache-from: type=registry,ref=${{ env.REGISTRY }}/ortho_gateway:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/ortho_gateway:buildcache,mode=max

  deploy:
    needs: [changes, backend, frontend, gateway]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: gasan
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            export TAG=${{ env.IMAGE_TAG }}
            export RECAPTCHA_SECRET='${{ secrets.RECAPTCHA_SECRET }}'
            export BACKEND_CHANGED='${{ needs.changes.outputs.backend }}'
            export FRONTEND_CHANGED='${{ needs.changes.outputs.frontend }}'
            export GATEWAY_CHANGED='${{ needs.changes.outputs.gateway }}'
            /srv/jml/deploy.sh
