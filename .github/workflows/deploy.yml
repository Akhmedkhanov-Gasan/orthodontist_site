on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: agasan

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/ortho_backend:${{ github.sha }}
            ${{ env.REGISTRY }}/ortho_backend:prod
          cache-from: type=registry,ref=${{ env.REGISTRY }}/ortho_backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/ortho_backend:buildcache,mode=max

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/ortho_frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/ortho_frontend:prod
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.FRONTEND_API_URL }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/ortho_frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/ortho_frontend:buildcache,mode=max

  build-gateway:
    name: Build gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/ortho_gateway:${{ github.sha }}
            ${{ env.REGISTRY }}/ortho_gateway:prod
          cache-from: type=registry,ref=${{ env.REGISTRY }}/ortho_gateway:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/ortho_gateway:buildcache,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
      - build-gateway
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            /srv/jml/deploy.sh
