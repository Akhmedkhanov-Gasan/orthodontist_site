name: CI/CD

on:
  push:
    branches: [ main ]

env:
  IMAGE_TAG: ${{ github.sha }}

# ──────────────────── back ────────────────────
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & push backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: agasan/ortho_backend:${{ env.IMAGE_TAG }}

    - name: Smoke-test backend
      shell: bash
      run: |
        docker run -d --name ortho_test \
          -e DJANGO_SETTINGS_MODULE=orthodontist_site.settings.docker \
          -e RECAPTCHA_SECRET='${{ secrets.RECAPTCHA_SECRET }}' \
          -p 8000:8000 \
          agasan/ortho_backend:${{ env.IMAGE_TAG }}

        for n in {1..12}; do
          docker logs ortho_test 2>&1 | grep -q "Starting gunicorn" && break
          sleep 2
        done

        docker exec ortho_test curl -sf http://localhost:8000/health/ >/dev/null
        docker rm -f ortho_test
      timeout-minutes: 2

# ────────────────── front ─────────────────────
  frontend:
    needs: backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: agasan/ortho_frontend:${{ env.IMAGE_TAG }}
        build-args: |
          NEXT_PUBLIC_API_URL=${{ secrets.FRONTEND_API_URL }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}

# ────────────────── gateway ───────────────────
  gateway:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & push gateway
      uses: docker/build-push-action@v5
      with:
        context: ./nginx
        push: true
        tags: agasan/ortho_gateway:${{ env.IMAGE_TAG }}

# ────────────────── deploy ────────────────────
  deploy:
    needs: [backend, frontend, gateway]
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_IP }}
        username: gasan
        key: ${{ secrets.SSH_KEY }}
        script: |
          export TAG=${{ env.IMAGE_TAG }}
          export RECAPTCHA_SECRET='${{ secrets.RECAPTCHA_SECRET }}'
          /srv/jml/deploy.sh
