name: CI/CD
on:
  push:
    branches: [ main ]

env:
  IMAGE_TAG: ${{ github.sha }}
  REGISTRY:  agasan

jobs:
# ────────────── build-backend ──────────────
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & push backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ env.REGISTRY }}/ortho_backend:${{ env.IMAGE_TAG }}

    - name: Smoke-test backend
      run: |
        ./.github/scripts/smoke_backend.sh \
          "${{ env.REGISTRY }}/ortho_backend:${{ env.IMAGE_TAG }}" \
          '${{ secrets.RECAPTCHA_SECRET }}'
          
# ───────────── build-frontend ──────────────
  frontend:
    needs: backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ env.REGISTRY }}/ortho_frontend:${{ env.IMAGE_TAG }}
        build-args: |
          NEXT_PUBLIC_API_URL=${{ secrets.FRONTEND_API_URL }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}

# ───────────── build-gateway ───────────────
  gateway:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & push gateway
      uses: docker/build-push-action@v5
      with:
        context: ./nginx
        push: true
        tags: ${{ env.REGISTRY }}/ortho_gateway:${{ env.IMAGE_TAG }}

# ───────────────── deploy ──────────────────
  deploy:
    needs: [backend, frontend, gateway]
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_IP }}
        username: gasan
        key: ${{ secrets.SSH_KEY }}
        command_timeout: 30m
        script: |
          export TAG=${{ env.IMAGE_TAG }}
          export RECAPTCHA_SECRET='${{ secrets.RECAPTCHA_SECRET }}'
          /srv/jml/deploy.sh
