name: CI/CD

on:
  push:
    branches: [ main ]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # ───────── Docker Build & Push ─────────
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # ---------- backend ----------
    - name: Build & push backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: agasan/ortho_backend:${{ env.IMAGE_TAG }}

    - name: Smoke-test backend image
      run: |
        docker run -d --name ortho_test \
          -e DJANGO_SETTINGS_MODULE=orthodontist_site.settings.docker \
          -e RECAPTCHA_SECRET='${{ secrets.RECAPTCHA_SECRET }}' \
          -p 8000:8000 \
          agasan/ortho_backend:${{ env.IMAGE_TAG }}

        # ждём gunicorn
        for i in {1..12}; do
          docker logs ortho_test 2>&1 | grep -q "Starting gunicorn" && break
          sleep 2
        done

        # проверка health-эндпоинта
        docker exec ortho_test curl -sf http://localhost:8000/health/ >/dev/null

        docker rm -f ortho_test
      timeout-minutes: 2

    # ---------- frontend ----------
    - name: Build & push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: agasan/ortho_frontend:${{ env.IMAGE_TAG }}
        build-args: |
          NEXT_PUBLIC_API_URL=${{ secrets.FRONTEND_API_URL }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}

    # ---------- nginx ----------
    - name: Build & push gateway
      uses: docker/build-push-action@v5
      with:
        context: ./nginx
        push: true
        tags: agasan/ortho_gateway:${{ env.IMAGE_TAG }}

    # ───────── Deploy via SSH ─────────
    - name: Deploy on server
      uses: appleboy/ssh-action@v1
      with:
        host:     ${{ secrets.SERVER_IP }}
        username: gasan
        key:      ${{ secrets.SSH_KEY }}
        script: |
          export TAG=${{ env.IMAGE_TAG }}
          export RECAPTCHA_SECRET='${{ secrets.RECAPTCHA_SECRET }}'
          /srv/jml/deploy.sh
