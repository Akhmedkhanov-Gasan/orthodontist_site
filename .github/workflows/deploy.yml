name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: agasan

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show deployment target
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI env files
        run: |
          cp .env.ci .env
          cp .env.frontend.example .env.frontend

      - name: Build backend test image
        run: docker compose build backend

      - name: Start test dependencies
        run: docker compose up -d db redis

      - name: Run backend tests
        run: docker compose run --rm backend pytest

      - name: Stop test containers
        if: always()
        run: docker compose down -v

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.FRONTEND_API_URL }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: npm run build

  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/ortho_backend:${{ github.sha }}
            ${{ env.REGISTRY }}/ortho_backend:prod
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=min

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    needs: frontend-checks
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/ortho_frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/ortho_frontend:prod
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.FRONTEND_API_URL }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=min

  build-gateway:
    name: Build gateway image
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/ortho_gateway:${{ github.sha }}
            ${{ env.REGISTRY }}/ortho_gateway:prod
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=min

  deploy-sync:
    name: Sync server repository
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
      - build-gateway
    steps:
      - name: Sync repository on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /home/gasan/orthodontist_site
            git fetch origin main
            git reset --hard origin/main

  pull-images:
    name: Pull production images
    runs-on: ubuntu-latest
    needs: deploy-sync
    steps:
      - name: Pull Docker images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /home/gasan/orthodontist_site
            docker compose pull backend frontend gateway

  django-maintenance:
    name: Apply Django migrations and static
    runs-on: ubuntu-latest
    needs: pull-images
    steps:
      - name: Run migrations and collect static
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /home/gasan/orthodontist_site
            docker compose run --rm --no-deps backend python manage.py migrate --noinput
            docker compose run --rm --no-deps backend python manage.py collectstatic --noinput

  restart-backend:
    name: Restart backend
    runs-on: ubuntu-latest
    needs: django-maintenance
    steps:
      - name: Restart backend container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /home/gasan/orthodontist_site
            docker compose up -d --no-deps backend

  restart-frontend:
    name: Restart frontend
    runs-on: ubuntu-latest
    needs: pull-images
    steps:
      - name: Restart frontend container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /home/gasan/orthodontist_site
            docker compose up -d --no-deps frontend

  restart-gateway:
    name: Restart gateway
    runs-on: ubuntu-latest
    needs: restart-frontend
    steps:
      - name: Restart gateway container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /home/gasan/orthodontist_site
            docker compose up -d --no-deps gateway

  restart-bot:
    name: Restart bot
    runs-on: ubuntu-latest
    needs: restart-backend
    steps:
      - name: Restart bot container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /home/gasan/orthodontist_site
            docker compose up -d --no-deps bot

  health-check:
    name: Health checks
    runs-on: ubuntu-latest
    needs:
      - restart-backend
      - restart-frontend
      - restart-gateway
      - restart-bot
    steps:
      - name: Check production health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /home/gasan/orthodontist_site
            docker compose up -d --no-deps gateway
            sleep 5
            docker compose ps gateway